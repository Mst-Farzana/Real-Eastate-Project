services:
  - type: web
    name: real-estate-api
    runtime: docker
    dockerfilePath: ./backend/dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://real-eastate-project-gules.vercel.app
      - key: DB_CONNECTION
        value: mysql
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: DB_URL
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/secrets/ca.pem
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
