services:
  - type: web
    name: real-estate-api
    runtime: docker
    dockerfilePath: ./backend/dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: APP_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://real-eastate-project-gules.vercel.app
      - key: DB_CONNECTION
        value: tidb
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: TIDB_HOST
        sync: false
      - key: TIDB_PORT
        value: "4000"
      - key: TIDB_DATABASE
        value: real_estate
      - key: TIDB_USERNAME
        sync: false
      - key: TIDB_PASSWORD
        sync: false
      - key: TIDB_SSL_CA
        value: /etc/secrets/ca.pem
      - key: TIDB_SSL_VERIFY_SERVER_CERT
        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
